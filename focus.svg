<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace">
<defs>
<filter id="glow" x="-50" y="-50" width="1000" height="440" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-50" y="-50" width="1000" height="440" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070A1F"/><stop offset="1" stop-color="#111648"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C8CFF"/><stop offset="0.55" stop-color="#8FD3FF"/><stop offset="1" stop-color="#B9A8FF"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B9A8FF" fill-opacity="0.16"/></pattern>
</defs>
<rect width="900" height="340" rx="18" fill="url(#bg)"/>
<rect width="900" height="340" rx="18" fill="url(#dots)"/>
<g transform="translate(10,14)"><rect x="0" y="0" width="430" height="146" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.3"/><text x="408" y="126" font-size="46" font-weight="700" fill="#8FD3FF" fill-opacity="0.12" text-anchor="end">01</text><text x="26" y="42" font-size="18" font-weight="700"><tspan fill="#B9A8FF">&gt; </tspan><tspan fill="#8FD3FF" filter="url(#glowS)">software_dev</tspan></text><rect x="26" y="54" width="46" height="3" rx="1.5" fill="url(#neon)"/><text x="26" y="88" font-size="14" fill="#EAF2FF" fill-opacity="0.92">Web and mobile applications, backend</text><text x="26" y="110" font-size="14" fill="#EAF2FF" fill-opacity="0.92">integration, and practical problem-solving</text><path transform="translate(400,30) scale(0.7)" d="M0 -10Q1.2 -1.2 10 0Q1.2 1.2 0 10Q-1.2 1.2 -10 0Q-1.2 -1.2 0 -10Z" fill="#BFD9FF" filter="url(#glowS)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0.4s" repeatCount="indefinite"/></path></g><g transform="translate(460,14)"><rect x="0" y="0" width="430" height="146" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.3"/><text x="408" y="126" font-size="46" font-weight="700" fill="#B9A8FF" fill-opacity="0.12" text-anchor="end">02</text><text x="26" y="42" font-size="18" font-weight="700"><tspan fill="#B9A8FF">&gt; </tspan><tspan fill="#B9A8FF" filter="url(#glowS)">business_automation</tspan></text><rect x="26" y="54" width="46" height="3" rx="1.5" fill="url(#neon)"/><text x="26" y="88" font-size="14" fill="#EAF2FF" fill-opacity="0.92">Canvas apps, workflow automation,</text><text x="26" y="110" font-size="14" fill="#EAF2FF" fill-opacity="0.92">SharePoint and Dataverse solutions</text><path transform="translate(400,30) scale(0.7)" d="M0 -10Q1.2 -1.2 10 0Q1.2 1.2 0 10Q-1.2 1.2 -10 0Q-1.2 -1.2 0 -10Z" fill="#F7B8D8" filter="url(#glowS)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0.8s" repeatCount="indefinite"/></path></g><g transform="translate(10,178)"><rect x="0" y="0" width="430" height="146" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.3"/><text x="408" y="126" font-size="46" font-weight="700" fill="#9DB4FF" fill-opacity="0.12" text-anchor="end">03</text><text x="26" y="42" font-size="18" font-weight="700"><tspan fill="#B9A8FF">&gt; </tspan><tspan fill="#9DB4FF" filter="url(#glowS)">ui_ux</tspan></text><rect x="26" y="54" width="46" height="3" rx="1.5" fill="url(#neon)"/><text x="26" y="88" font-size="14" fill="#EAF2FF" fill-opacity="0.92">Wireframes, prototypes, accessible</text><text x="26" y="110" font-size="14" fill="#EAF2FF" fill-opacity="0.92">interfaces, and user-centred design</text><path transform="translate(400,30) scale(0.7)" d="M0 -10Q1.2 -1.2 10 0Q1.2 1.2 0 10Q-1.2 1.2 -10 0Q-1.2 -1.2 0 -10Z" fill="#BFD9FF" filter="url(#glowS)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="1.2000000000000002s" repeatCount="indefinite"/></path></g><g transform="translate(460,178)"><rect x="0" y="0" width="430" height="146" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.3"/><text x="408" y="126" font-size="46" font-weight="700" fill="#8FD3FF" fill-opacity="0.12" text-anchor="end">04</text><text x="26" y="42" font-size="18" font-weight="700"><tspan fill="#B9A8FF">&gt; </tspan><tspan fill="#8FD3FF" filter="url(#glowS)">cybersecurity</tspan></text><rect x="26" y="54" width="46" height="3" rx="1.5" fill="url(#neon)"/><text x="26" y="88" font-size="14" fill="#EAF2FF" fill-opacity="0.92">Learning security fundamentals through</text><text x="26" y="110" font-size="14" fill="#EAF2FF" fill-opacity="0.92">structured study and authorised practice labs</text><path transform="translate(400,30) scale(0.7)" d="M0 -10Q1.2 -1.2 10 0Q1.2 1.2 0 10Q-1.2 1.2 -10 0Q-1.2 -1.2 0 -10Z" fill="#BFD9FF" filter="url(#glowS)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="1.6s" repeatCount="indefinite"/></path></g>
<rect x="0.75" y="0.75" width="898.5" height="338.5" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
