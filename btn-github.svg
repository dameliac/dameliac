<svg xmlns="http://www.w3.org/2000/svg" width="270" height="56" viewBox="0 0 270 56" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace">
<defs>
<filter id="glow" x="-50" y="-50" width="370" height="156" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-50" y="-50" width="370" height="156" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070A1F"/><stop offset="1" stop-color="#111648"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C8CFF"/><stop offset="0.55" stop-color="#8FD3FF"/><stop offset="1" stop-color="#B9A8FF"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B9A8FF" fill-opacity="0.16"/></pattern>
</defs>
<rect width="270" height="56" rx="28" fill="url(#bg)"/>
<rect width="270" height="56" rx="28" fill="url(#dots)"/>
<rect x="1.5" y="1.5" width="267" height="53" rx="26.5" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#neon)" stroke-width="1.8" filter="url(#glowS)"><animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></rect><text x="30" y="35" font-size="15" font-weight="700" letter-spacing="2" fill="#8FD3FF" filter="url(#glowS)">GITHUB</text><text x="240" y="35" font-size="12" fill="#BFD9FF" text-anchor="end">@dameliac</text>
<rect x="0.75" y="0.75" width="268.5" height="54.5" rx="28" fill="none" stroke="url(#neon)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
